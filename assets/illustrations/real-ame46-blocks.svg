<svg xmlns="http://www.w3.org/2000/svg" width="960" height="335" viewBox="0 0 960 335" role="img" aria-labelledby="title desc">
<title id="title">Block structure of the three orthogonal reshapings</title>
<desc id="desc">For each of the bipartitions 12 given 34, 13 given 24, and 14 given 23, the rescaled coefficient tensor can be rearranged into a 36 by 36 block diagonal matrix containing twelve one-by-one blocks and twelve two-by-two blocks. Block positions shown schematically; signs and coefficient values are omitted.</desc>
